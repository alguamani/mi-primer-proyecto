<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucy Guamaní</title>
  <style>
    :root {
      --principal: #2563eb;
      --fondo: #f0f6ff;
      --texto: #1e293b;
    }
    body { font-family: Arial, sans-serif; margin: 0; text-align: center; color: var(--texto); background: var(--fondo); }
    section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    h1, h2 { color: var(--principal); }
    a.boton { background: var(--principal); color: #fff; padding: 12px 28px; border-radius: 8px; text-decoration: none; }
    a.whatsapp { background: #25d366; }
    .logo { width: 90px; height: 90px; border-radius: 50%; background: var(--principal); color: #fff; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    footer { padding: 20px; color: #777; }
  </style>
</head>
<body>
  <section>
    <div class="logo">ALGG</div>
    <h1>¡Bienvenido a mi sitio!</h1>
    <p>Gracias por visitarnos. Esta es mi primera página creada con ayuda de Claude.</p>
    <a class="boton" href="#inicio">Empezar</a>
  </section>
  <section id="inicio">
    <h2>Sobre mí</h2>
    <p>Hola, soy Lucy Guamaní. Soy de Quito, Ecuador y estoy aprendiendo a crear y hacer crecer negocios digitales.</p>
    <br>
    <a class="boton whatsapp" href="https://wa.me/593999826238">Escríbeme por WhatsApp</a>
  </section>
  <footer>Hecho con cariño · 2026</footer>
</body>
</html>
